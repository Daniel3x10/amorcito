<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- BT21 Cooky (Pink Bunny with one folded ear) -->
  <defs>
    <radialGradient id="cookyPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </radialGradient>
  </defs>
  <!-- Left Ear (Straight) -->
  <path d="M65,70 C50,20 70,5 82,25 C90,40 85,65 80,75 Z" fill="url(#cookyPink)" stroke="#1e1e1e" stroke-width="4"/>
  <path d="M68,60 C60,30 72,20 78,32 C82,42 78,58 75,64 Z" fill="#f9a8d4"/>
  
  <!-- Right Ear (Bent/Folded) -->
  <path d="M125,75 C120,45 135,25 150,30 C155,40 145,55 130,58 C135,68 128,75 125,75 Z" fill="url(#cookyPink)" stroke="#1e1e1e" stroke-width="4"/>
  
  <!-- Head -->
  <ellipse cx="100" cy="115" rx="55" ry="48" fill="url(#cookyPink)" stroke="#1e1e1e" stroke-width="4.5"/>
  
  <!-- Left Eyebrow (Arch) -->
  <path d="M68,102 Q78,92 86,102" fill="none" stroke="#1e1e1e" stroke-width="4" stroke-linecap="round"/>
  <!-- Right Eyebrow (Stern Cooky Brow) -->
  <path d="M114,103 Q122,94 132,100" fill="none" stroke="#1e1e1e" stroke-width="4" stroke-linecap="round"/>

  <!-- Eyes -->
  <circle cx="77" cy="114" r="5" fill="#1e1e1e"/>
  <circle cx="123" cy="114" r="5" fill="#1e1e1e"/>

  <!-- Nose & Mouth -->
  <ellipse cx="100" cy="122" rx="4" ry="3" fill="#ec4899"/>
  <path d="M96,128 Q100,132 104,128" fill="none" stroke="#1e1e1e" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Cheeks -->
  <ellipse cx="64" cy="122" rx="7" ry="4" fill="#fb7185" opacity="0.6"/>
  <ellipse cx="136" cy="122" rx="7" ry="4" fill="#fb7185" opacity="0.6"/>
</svg>
